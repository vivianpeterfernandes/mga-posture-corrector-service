# =======================================================
# SERVICE Configuration
# =======================================================
spring.application.name=mga-posture-corrector-service
server.port=8087
# ==========================================
# EXPAND BOUNDARIES TO ACCOMODATE RAW SMARTPHONE MEDIA FILES
# ==========================================
# Max file size allowed for an individual upload
spring.servlet.multipart.max-file-size=100MB
# Max total request size allowed (including video data + form metadata)
spring.servlet.multipart.max-request-size=100MB
# =======================================================
# EUREKA / DISCOVERY Configuration
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# ====================================================================================================
# SUPABASE AUTOMATED AWS S3 COMPATIBLE STORAGE PROPERTIES
# ====================================================================================================
AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
AWS_S3_REGION=${AWS_S3_REGION}
AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID}
AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}
# Disable AWS SDK warning metrics loops to save processor cycles
aws.disableEc2Metadata=true